<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>纯前端 · 每日饮食助手</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #f7f9fc;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      color: #1e2b3c;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .app {
      max-width: 860px;
      width: 100%;
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.06);
      padding: 2rem 1.8rem 2rem;
      margin-bottom: 2rem;
    }
    h1 {
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
      color: #0f2b3d;
    }
    h1 span {
      background: #d0e7ff;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 0.2rem 0.9rem;
      color: #0057a3;
      margin-left: 0.5rem;
    }
    .subhead {
      color: #5f6c80;
      font-size: 0.98rem;
      margin-bottom: 1.8rem;
      border-left: 4px solid #a0c8ff;
      padding-left: 1rem;
      background: #f0f7ff;
      border-radius: 0 8px 8px 0;
      line-height: 1.5;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.2rem;
      margin-bottom: 1.8rem;
    }
    @media (max-width: 600px) {
      .grid-2 {
        grid-template-columns: 1fr;
      }
    }
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      margin-bottom: 0.6rem;
    }
    label {
      font-size: 0.85rem;
      font-weight: 500;
      color: #2f4055;
      letter-spacing: 0.01em;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }
    label i {
      font-style: normal;
      opacity: 0.6;
    }
    input, select {
      padding: 0.7rem 0.9rem;
      border: 1px solid #d9e2ef;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #ffffff;
      transition: all 0.15s;
      font-family: inherit;
      width: 100%;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #7eb6ff;
      box-shadow: 0 0 0 3px rgba(126, 182, 255, 0.2);
    }
    .activity-hint {
      font-size: 0.75rem;
      color: #6f7d91;
      margin-top: 0.1rem;
    }
    .btn {
      background: #1f6fd0;
      border: none;
      color: white;
      font-weight: 600;
      padding: 0.9rem 1.5rem;
      border-radius: 40px;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 6px 14px rgba(31, 111, 208, 0.25);
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
      letter-spacing: 0.01em;
    }
    .btn:hover {
      background: #105db8;
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(31, 111, 208, 0.3);
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 4px 8px rgba(31, 111, 208, 0.2);
    }
    .btn-secondary {
      background: #ffffff;
      color: #1f6fd0;
      border: 1px solid #c4d9f5;
      box-shadow: none;
    }
    .btn-secondary:hover {
      background: #f0f7ff;
      transform: none;
      box-shadow: none;
    }
    .results {
      margin-top: 2rem;
      border-top: 1px dashed #cbd6e6;
      padding-top: 1.8rem;
    }
    .calorie-card {
      background: linear-gradient(135deg, #eef6ff 0%, #e0efff 100%);
      border-radius: 24px;
      padding: 1.5rem 1.5rem 1.2rem;
      margin-bottom: 1.6rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
    }
    .calorie-big {
      font-size: 2.4rem;
      font-weight: 700;
      color: #004b9b;
      line-height: 1.1;
    }
    .calorie-label {
      font-size: 0.9rem;
      color: #3e5f82;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }
    .macro-badges {
      display: flex;
      gap: 0.7rem;
      margin-top: 0.5rem;
      flex-wrap: wrap;
    }
    .badge {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(4px);
      padding: 0.3rem 0.9rem;
      border-radius: 30px;
      font-size: 0.8rem;
      font-weight: 500;
      color: #1f4e7a;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }
    .meal-plan {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }
    .meal-item {
      background: #ffffff;
      border: 1px solid #e2eaf5;
      border-radius: 20px;
      padding: 1.2rem 1.3rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .meal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .meal-title {
      font-weight: 650;
      font-size: 1.1rem;
      color: #153e5c;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .meal-title .emoji {
      font-size: 1.3rem;
    }
    .meal-kcal {
      background: #f0f5fe;
      border-radius: 30px;
      padding: 0.2rem 0.9rem;
      font-size: 0.85rem;
      font-weight: 600;
      color: #1f6fd0;
    }
    .food-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem 1rem;
      font-size: 0.92rem;
      color: #2e405b;
      padding: 0.1rem 0;
    }
    .food-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      background: #fafcff;
      padding: 0.2rem 0.8rem;
      border-radius: 30px;
      border: 1px solid #dfe9f5;
    }
    .feedback-row {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.3rem;
      border-top: 1px solid #ecf2fa;
      padding-top: 0.7rem;
      font-size: 0.85rem;
      color: #4a627c;
    }
    .feedback-btns {
      display: flex;
      gap: 0.4rem;
      margin-left: auto;
    }
    .feedback-btns button {
      background: #ffffff;
      border: 1px solid #d0def0;
      border-radius: 30px;
      padding: 0.2rem 0.8rem;
      font-size: 0.75rem;
      cursor: pointer;
      color: #2d4f73;
      transition: all 0.1s;
      font-weight: 500;
    }
    .feedback-btns button.active {
      background: #1f6fd0;
      border-color: #1f6fd0;
      color: white;
    }
    .feedback-btns button:hover {
      background: #e5f0ff;
    }
    .feedback-btns button.active:hover {
      background: #105db8;
    }
    .note {
      font-size: 0.78rem;
      color: #7f8fa3;
      margin-top: 1.2rem;
      text-align: center;
      border-top: 1px solid #e5ecf5;
      padding-top: 1.2rem;
      line-height: 1.6;
    }
    .warning {
      background: #fff4e5;
      border-left: 5px solid #ffa726;
      color: #7a4d00;
      padding: 0.8rem 1rem;
      border-radius: 12px;
      font-size: 0.88rem;
      margin: 1rem 0 0.5rem;
    }
    .hidden {
      display: none !important;
    }
    .flex-between {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .mt-2 {
      margin-top: 0.8rem;
    }
    .small-label {
      font-size: 0.78rem;
      color: #62758c;
      font-weight: 400;
    }
    .food-db-note {
      background: #f2f6fd;
      border-radius: 30px;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      color: #30649b;
      display: inline-block;
    }
  </style>
</head>
<body>
<div class="app">
  <h1>
    🥗 每日饮食助手
    <span>纯前端</span>
  </h1>
  <div class="subhead">
    根据你的身体数据和活动水平，估算每日热量目标，并生成三餐搭配参考。<br>
    所有计算均在本地完成，数据不会上传。
  </div>

  <!-- 用户输入区 -->
  <div class="grid-2">
    <div class="input-group">
      <label>性别 <i>⚥</i></label>
      <select id="gender">
        <option value="male">男</option>
        <option value="female" selected>女</option>
      </select>
    </div>
    <div class="input-group">
      <label>年龄 <i>📅</i></label>
      <input type="number" id="age" value="30" min="15" max="90" step="1">
    </div>
    <div class="input-group">
      <label>身高 (cm) <i>📏</i></label>
      <input type="number" id="height" value="165" min="120" max="220" step="1">
    </div>
    <div class="input-group">
      <label>体重 (kg) <i>⚖️</i></label>
      <input type="number" id="weight" value="60" min="30" max="200" step="0.5">
    </div>
    <div class="input-group">
      <label>活动水平 <i>🏃</i></label>
      <select id="activity">
        <option value="1.2">久坐 (很少运动)</option>
        <option value="1.375" selected>轻度活动 (每周1-3次)</option>
        <option value="1.55">中度活动 (每周3-5次)</option>
        <option value="1.725">高强度 (每周6-7次)</option>
        <option value="1.9">极高强度 (体力工作/运动员)</option>
      </select>
      <div class="activity-hint">选择近期的平均活动量</div>
    </div>
    <div class="input-group">
      <label>目标 <i>🎯</i></label>
      <select id="goal">
        <option value="maintain" selected>维持体重</option>
        <option value="lose">减重 (每周0.3-0.5kg)</option>
        <option value="gain">增重/增肌</option>
      </select>
    </div>
  </div>

  <button class="btn" id="calcBtn">✨ 生成我的每日计划</button>

  <!-- 结果展示区 -->
  <div id="results" class="results hidden">
    <!-- 热量卡片 -->
    <div class="calorie-card" id="calorieCard">
      <div>
        <div class="calorie-label">每日建议摄入热量</div>
        <div class="calorie-big" id="calorieValue">0</div>
        <div class="calorie-label" style="margin-top:4px;">kcal</div>
      </div>
      <div>
        <div class="macro-badges" id="macroBadges">
          <!-- 动态填充 -->
        </div>
        <div class="food-db-note" style="margin-top:8px;">基于膳食宝塔·本地食物库</div>
      </div>
    </div>

    <!-- 警告区域 (如果热量过低) -->
    <div id="warningBox" class="warning hidden"></div>

    <!-- 三餐计划 -->
    <div class="meal-plan" id="mealPlan">
      <!-- 动态生成三餐 -->
    </div>

    <!-- 底部反馈与重置 -->
    <div class="flex-between mt-2">
      <span class="small-label">👆 点击饱腹感可微调下一餐份量</span>
      <button class="btn btn-secondary" id="resetBtn" style="width:auto; padding:0.5rem 1.2rem; font-size:0.85rem;">重新生成</button>
    </div>

    <!-- 免责声明 -->
    <div class="note">
      ⚕️ 本工具提供通用饮食参考，不构成医疗建议。<br>
      特殊人群（糖尿病、肾病、孕期等）请咨询专业医师或营养师。
    </div>
  </div>
</div>

<script>
  (function() {
    // ---------- 食物数据库 (基于常见食物，每100g可食部) ----------
    const FOOD_DB = [
      // 谷薯类
      { name: '米饭', category: '谷薯', per100: { kcal: 116, protein: 2.6, fat: 0.3, carbs: 25.9 }, unit: 'g' },
      { name: '馒头', category: '谷薯', per100: { kcal: 223, protein: 7.0, fat: 1.1, carbs: 47.0 }, unit: 'g' },
      { name: '全麦面包', category: '谷薯', per100: { kcal: 246, protein: 9.0, fat: 3.2, carbs: 45.0 }, unit: 'g' },
      { name: '燕麦片(干)', category: '谷薯', per100: { kcal: 377, protein: 13.2, fat: 6.7, carbs: 66.0 }, unit: 'g' },
      { name: '红薯', category: '谷薯', per100: { kcal: 86, protein: 1.6, fat: 0.1, carbs: 20.1 }, unit: 'g' },
      { name: '玉米(鲜)', category: '谷薯', per100: { kcal: 112, protein: 4.0, fat: 1.2, carbs: 22.8 }, unit: 'g' },
      // 蔬菜类
      { name: '西兰花', category: '蔬菜', per100: { kcal: 34, protein: 2.8, fat: 0.4, carbs: 6.6 }, unit: 'g' },
      { name: '菠菜', category: '蔬菜', per100: { kcal: 23, protein: 2.9, fat: 0.4, carbs: 3.6 }, unit: 'g' },
      { name: '番茄', category: '蔬菜', per100: { kcal: 18, protein: 0.9, fat: 0.2, carbs: 3.9 }, unit: 'g' },
      { name: '黄瓜', category: '蔬菜', per100: { kcal: 15, protein: 0.7, fat: 0.1, carbs: 3.6 }, unit: 'g' },
      { name: '胡萝卜', category: '蔬菜', per100: { kcal: 41, protein: 0.9, fat: 0.2, carbs: 9.6 }, unit: 'g' },
      { name: '生菜', category: '蔬菜', per100: { kcal: 15, protein: 1.4, fat: 0.2, carbs: 2.9 }, unit: 'g' },
      // 水果类
      { name: '苹果', category: '水果', per100: { kcal: 52, protein: 0.3, fat: 0.2, carbs: 13.8 }, unit: 'g' },
      { name: '香蕉', category: '水果', per100: { kcal: 89, protein: 1.1, fat: 0.3, carbs: 22.8 }, unit: 'g' },
      { name: '蓝莓', category: '水果', per100: { kcal: 57, protein: 0.7, fat: 0.3, carbs: 14.5 }, unit: 'g' },
      { name: '橙子', category: '水果', per100: { kcal: 47, protein: 0.9, fat: 0.1, carbs: 11.8 }, unit: 'g' },
      { name: '猕猴桃', category: '水果', per100: { kcal: 61, protein: 1.1, fat: 0.5, carbs: 14.7 }, unit: 'g' },
      // 蛋白质类
      { name: '鸡胸肉', category: '蛋白质', per100: { kcal: 167, protein: 31.0, fat: 3.6, carbs: 0 }, unit: 'g' },
      { name: '鸡蛋', category: '蛋白质', per100: { kcal: 155, protein: 13.0, fat: 11.0, carbs: 1.1 }, unit: 'g' },
      { name: '三文鱼', category: '蛋白质', per100: { kcal: 208, protein: 20.0, fat: 13.0, carbs: 0 }, unit: 'g' },
      { name: '瘦牛肉', category: '蛋白质', per100: { kcal: 250, protein: 26.0, fat: 15.0, carbs: 0 }, unit: 'g' },
      { name: '豆腐(北)', category: '蛋白质', per100: { kcal: 116, protein: 12.2, fat: 6.7, carbs: 3.8 }, unit: 'g' },
      { name: '虾仁', category: '蛋白质', per100: { kcal: 99, protein: 20.0, fat: 1.0, carbs: 0.2 }, unit: 'g' },
      { name: '无糖希腊酸奶', category: '蛋白质', per100: { kcal: 73, protein: 10.0, fat: 1.9, carbs: 3.6 }, unit: 'g' },
      // 奶类 (合并到蛋白质或单列, 这里简化)
      { name: '牛奶(全脂)', category: '奶类', per100: { kcal: 65, protein: 3.3, fat: 3.6, carbs: 4.9 }, unit: 'ml' },
      // 坚果/油脂
      { name: '杏仁', category: '坚果', per100: { kcal: 579, protein: 21.0, fat: 50.0, carbs: 22.0 }, unit: 'g' },
      { name: '橄榄油', category: '油脂', per100: { kcal: 884, protein: 0, fat: 100, carbs: 0 }, unit: 'g' },
    ];

    // 按类别分组便于随机抽取
    const byCategory = {
      '谷薯': FOOD_DB.filter(f => f.category === '谷薯'),
      '蔬菜': FOOD_DB.filter(f => f.category === '蔬菜'),
      '水果': FOOD_DB.filter(f => f.category === '水果'),
      '蛋白质': FOOD_DB.filter(f => f.category === '蛋白质'),
      '奶类': FOOD_DB.filter(f => f.category === '奶类'),
      '坚果': FOOD_DB.filter(f => f.category === '坚果'),
      '油脂': FOOD_DB.filter(f => f.category === '油脂'),
    };

    // 当前用户的热量目标与宏量营养素参考
    let currentPlan = {
      targetKcal: 0,
      proteinG: 0,
      fatG: 0,
      carbsG: 0,
    };

    // 存储每餐的反馈状态 (0:未选, 1:七分饱, 2:十分饱)
    let mealFeedback = {
      breakfast: 0,
      lunch: 0,
      dinner: 0
    };

    // DOM 元素
    const genderEl = document.getElementById('gender');
    const ageEl = document.getElementById('age');
    const heightEl = document.getElementById('height');
    const weightEl = document.getElementById('weight');
    const activityEl = document.getElementById('activity');
    const goalEl = document.getElementById('goal');
    const calcBtn = document.getElementById('calcBtn');
    const resultsDiv = document.getElementById('results');
    const calorieValueEl = document.getElementById('calorieValue');
    const macroBadgesEl = document.getElementById('macroBadges');
    const warningBox = document.getElementById('warningBox');
    const mealPlanEl = document.getElementById('mealPlan');
    const resetBtn = document.getElementById('resetBtn');

    // ---------- 工具函数 ----------
    function calcBMR(gender, weightKg, heightCm, age) {
      // Mifflin-St Jeor
      if (gender === 'male') {
        return 10 * weightKg + 6.25 * heightCm - 5 * age + 5;
      } else {
        return 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
      }
    }

    function calcTDEE(bmr, activityFactor) {
      return bmr * activityFactor;
    }

    // 根据目标调整热量
    function adjustForGoal(tdee, goal) {
      if (goal === 'lose') {
        // 减重: 减去300~500, 但不低于BMR的1.1倍(安全下限)
        let target = tdee - 400;
        // 稍后会用BMR做安全限制
        return { target, deficit: 400 };
      } else if (goal === 'gain') {
        return { target: tdee + 300, surplus: 300 };
      } else {
        return { target: tdee, surplus: 0 };
      }
    }

    // 生成三餐分配 (早30% 午40% 晚30%)
    function getMealDistribution(targetKcal) {
      return {
        breakfast: Math.round(targetKcal * 0.3),
        lunch: Math.round(targetKcal * 0.4),
        dinner: Math.round(targetKcal * 0.3)
      };
    }

    // 根据热量从食物库抽取组合 (简易算法: 每餐包含谷薯+蛋白质+蔬菜, 并控制总热量接近)
    function generateMeal(mealKcal, mealType, feedbackAdjust = 0) {
      // 调整后的目标热量 (反馈微调)
      let adjustedKcal = mealKcal;
      if (feedbackAdjust === 1) { // 七分饱 -> 下一餐减少约15%
        adjustedKcal = Math.round(mealKcal * 0.85);
      } else if (feedbackAdjust === 2) { // 十分饱 -> 下一餐减少约25%
        adjustedKcal = Math.round(mealKcal * 0.75);
      }
      // 确保最低热量不低于200
      adjustedKcal = Math.max(adjustedKcal, 200);

      // 按比例分配: 谷薯45% 蛋白质30% 蔬菜25% (蔬菜热量低, 可适当多)
      const carbKcal = adjustedKcal * 0.45;
      const proteinKcal = adjustedKcal * 0.30;
      const vegKcal = adjustedKcal * 0.25;

      // 随机选取食物并计算份量 (简化: 直接按热量比例计算克数)
      function pickFood(category, targetKcal, count = 1) {
        const list = byCategory[category] || [];
        if (list.length === 0) return [];
        // 随机打乱取前count个
        const shuffled = [...list].sort(() => Math.random() - 0.5);
        const selected = shuffled.slice(0, count);
        // 每个食物分配热量 平均分配
        const kcalPerItem = targetKcal / count;
        return selected.map(food => {
          const grams = Math.round((kcalPerItem / food.per100.kcal) * 100);
          // 限制克数在合理范围
          const clampedGrams = Math.min(Math.max(grams, 20), 300);
          return {
            name: food.name,
            grams: clampedGrams,
            unit: food.unit || 'g',
            kcal: Math.round((food.per100.kcal * clampedGrams) / 100)
          };
        });
      }

      // 谷薯 1~2种
      const carbCount = Math.random() > 0.5 ? 2 : 1;
      const carbs = pickFood('谷薯', carbKcal, carbCount);
      // 蛋白质 1~2种
      const proteinCount = Math.random() > 0.6 ? 2 : 1;
      const proteins = pickFood('蛋白质', proteinKcal, proteinCount);
      // 蔬菜 2种
      const vegs = pickFood('蔬菜', vegKcal, 2);
      // 可少量添加水果或奶类作为补充 (仅早餐/加餐)
      let extras = [];
      if (mealType === 'breakfast' && Math.random() > 0.5) {
        extras = pickFood('水果', 60, 1);
      } else if (mealType === 'lunch' && Math.random() > 0.7) {
        extras = pickFood('奶类', 80, 1);
      } else if (mealType === 'dinner' && Math.random() > 0.8) {
        extras = pickFood('坚果', 50, 1);
      }

      const allItems = [...carbs, ...proteins, ...vegs, ...extras];
      // 计算总热量
      const totalKcal = allItems.reduce((sum, item) => sum + item.kcal, 0);

      return {
        items: allItems,
        totalKcal: totalKcal,
        adjustedKcal: adjustedKcal,
      };
    }

    // 渲染三餐
    function renderMeals(distribution, feedbackState = { breakfast: 0, lunch: 0, dinner: 0 }) {
      // 早餐反馈影响午餐, 午餐反馈影响晚餐, 晚餐反馈影响次日早餐(暂不体现)
      const breakfast = generateMeal(distribution.breakfast, 'breakfast', 0);
      const lunch = generateMeal(distribution.lunch, 'lunch', feedbackState.breakfast);
      const dinner = generateMeal(distribution.dinner, 'dinner', feedbackState.lunch);

      const meals = [
        { type: 'breakfast', title: '🌅 早餐', data: breakfast, feedbackKey: 'breakfast' },
        { type: 'lunch', title: '☀️ 午餐', data: lunch, feedbackKey: 'lunch' },
        { type: 'dinner', title: '🌙 晚餐', data: dinner, feedbackKey: 'dinner' },
      ];

      mealPlanEl.innerHTML = meals.map(meal => {
        const itemsHtml = meal.data.items.map(item =>
          `<span class="food-item">${item.name} ${item.grams}${item.unit} · ${item.kcal}kcal</span>`
        ).join('');

        const active1 = feedbackState[meal.feedbackKey] === 1 ? 'active' : '';
        const active2 = feedbackState[meal.feedbackKey] === 2 ? 'active' : '';

        return `
          <div class="meal-item" data-meal="${meal.type}">
            <div class="meal-header">
              <div class="meal-title"><span class="emoji">${meal.title.slice(0,2)}</span> ${meal.title.slice(2)}</div>
              <div class="meal-kcal">约 ${meal.data.totalKcal} kcal</div>
            </div>
            <div class="food-list">${itemsHtml}</div>
            <div class="feedback-row">
              <span>饱腹感:</span>
              <div class="feedback-btns" data-meal="${meal.feedbackKey}">
                <button class="${active1}" data-feedback="1" data-meal="${meal.feedbackKey}">七分饱</button>
                <button class="${active2}" data-feedback="2" data-meal="${meal.feedbackKey}">十分饱</button>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // 绑定反馈按钮事件
      document.querySelectorAll('.feedback-btns button').forEach(btn => {
        btn.addEventListener('click', function(e) {
          const mealKey = this.dataset.meal;
          const value = parseInt(this.dataset.feedback, 10);
          // 切换: 如果已激活相同值，则取消
          if (mealFeedback[mealKey] === value) {
            mealFeedback[mealKey] = 0;
          } else {
            mealFeedback[mealKey] = value;
          }
          // 重新渲染餐单 (基于当前反馈)
          const newDistribution = getMealDistribution(currentPlan.targetKcal);
          renderMeals(newDistribution, mealFeedback);
          // 更新按钮样式在renderMeals里处理
        });
      });
    }

    // 主流程: 计算并展示
    function calculateAndRender() {
      // 读取输入
      const gender = genderEl.value;
      const age = parseFloat(ageEl.value) || 30;
      const height = parseFloat(heightEl.value) || 165;
      const weight = parseFloat(weightEl.value) || 60;
      const activity = parseFloat(activityEl.value) || 1.375;
      const goal = goalEl.value;

      // 基本验证
      if (age < 15 || age > 90 || height < 120 || height > 220 || weight < 30 || weight > 200) {
        alert('请输入合理的身体数据 (年龄15-90, 身高120-220cm, 体重30-200kg)');
        return;
      }

      const bmr = calcBMR(gender, weight, height, age);
      const tdee = calcTDEE(bmr, activity);
      const { target } = adjustForGoal(tdee, goal);

      // 安全限制: 每日摄入不低于BMR*1.0 (极端情况)
      let safeTarget = Math.round(target);
      const minCal = Math.round(bmr * 1.0);
      if (safeTarget < minCal) {
        safeTarget = minCal;
        warningBox.classList.remove('hidden');
        warningBox.innerHTML = `⚠️ 为了健康，每日摄入热量不应低于基础代谢 (${Math.round(bmr)} kcal)。已自动调整至安全下限。`;
      } else {
        warningBox.classList.add('hidden');
      }

      // 限制极端高热量
      if (safeTarget > 5000) safeTarget = 5000;

      // 计算宏量营养素 (参考: 碳水50% 蛋白质20% 脂肪30%)
      const carbsG = Math.round((safeTarget * 0.5) / 4);
      const proteinG = Math.round((safeTarget * 0.2) / 4);
      const fatG = Math.round((safeTarget * 0.3) / 9);

      currentPlan = {
        targetKcal: safeTarget,
        carbsG,
        proteinG,
        fatG,
      };

      // 更新热量卡片
      calorieValueEl.textContent = safeTarget;
      macroBadgesEl.innerHTML = `
        <span class="badge">碳水 ${carbsG}g</span>
        <span class="badge">蛋白质 ${proteinG}g</span>
        <span class="badge">脂肪 ${fatG}g</span>
      `;

      // 重置反馈状态
      mealFeedback = { breakfast: 0, lunch: 0, dinner: 0 };

      // 三餐分配
      const distribution = getMealDistribution(safeTarget);
      renderMeals(distribution, mealFeedback);

      // 显示结果区域
      resultsDiv.classList.remove('hidden');
      // 滚动到结果
      resultsDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // 重置/重新生成
    function resetAndRegenerate() {
      // 保留用户输入，重新生成（保持相同目标但重新随机搭配）
      if (currentPlan.targetKcal === 0) {
        calculateAndRender();
        return;
      }
      // 重新生成三餐，重置反馈
      mealFeedback = { breakfast: 0, lunch: 0, dinner: 0 };
      const distribution = getMealDistribution(currentPlan.targetKcal);
      renderMeals(distribution, mealFeedback);
    }

    // 绑定事件
    calcBtn.addEventListener('click', calculateAndRender);

    resetBtn.addEventListener('click', resetAndRegenerate);

    // 如果修改了输入参数，隐藏结果或提示重新计算
    [genderEl, ageEl, heightEl, weightEl, activityEl, goalEl].forEach(el => {
      el.addEventListener('change', () => {
        // 不自动计算，但可以给个视觉提醒
        resultsDiv.classList.add('hidden');
      });
    });

    // 初始化: 默认不显示结果，但可以预先填充示例数据，不自动计算
    // 用户点击按钮才会显示

    // 可选：页面加载后自动计算一次 (注释掉，让用户主动点击)
    // window.addEventListener('load', () => {
    //   calculateAndRender();
    // });

  })();
</script
